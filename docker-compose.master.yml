services:
  # --- MASTER API GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: master-gateway
    ports:
      - "8085:80"
    volumes:
      - ./linux-nginx-configs/master-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth-service
      - user-service
      - product-service
      - backend-1
      - backend-2
      - backend-3
    networks:
      - master-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ./simple-crud-frontend
    container_name: master-frontend
    environment:
      - VITE_API_HOST=http://localhost:8085
      - APP_NAME=Nginx Master (Decoupled)
    networks:
      - master-network

  # --- MICROSERVICES ---
  auth-service:
    build: ./microservices-app/auth-service
    container_name: auth-service
    environment:
      - PORT=4001
      - NODE_ENV=production
    networks:
      - master-network

  user-service:
    build: ./microservices-app/user-service
    container_name: user-service
    environment:
      - PORT=4002
      - NODE_ENV=production
      - JWT_SECRET=supersecretkey
    networks:
      - master-network

  product-service:
    build: ./microservices-app/product-service
    container_name: product-service
    environment:
      - PORT=4003
      - NODE_ENV=production
      - JWT_SECRET=supersecretkey
    networks:
      - master-network

  # --- CRUD BACKENDS ---
  backend-1:
    build: ./simple-crud-backend
    container_name: master-backend-1
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - NODE_ENV=production
    networks:
      - master-network

  backend-2:
    build: ./simple-crud-backend
    container_name: master-backend-2
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - NODE_ENV=production
    networks:
      - master-network

  backend-3:
    build: ./simple-crud-backend
    container_name: master-backend-3
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-3
      - NODE_ENV=production
    networks:
      - master-network

networks:
  master-network:
    driver: bridge
