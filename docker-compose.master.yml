services:
  # --- MASTER API GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: master-gateway
    ports:
      - "8085:80"
      - "8443:443"
    volumes:
      - ./linux-nginx-configs/master-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./linux-nginx-configs/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - auth-service
      - user-service
      - product-service
      - backend-1
      - backend-2
      - backend-3
    networks:
      - master-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ./simple-crud-frontend
    container_name: master-frontend
    environment:
      - VITE_API_HOST=https://localhost:8443
      - APP_NAME=Nginx Master (Decoupled)
    networks:
      - master-network

  # --- MICROSERVICES ---
  auth-service:
    build: ./microservices-app/auth-service
    container_name: auth-service
    environment:
      - PORT=4001
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

  user-service:
    build: ./microservices-app/user-service
    container_name: user-service
    environment:
      - PORT=4002
      - NODE_ENV=production
      - JWT_SECRET=supersecretkey
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

  product-service:
    build: ./microservices-app/product-service
    container_name: product-service
    environment:
      - PORT=4003
      - NODE_ENV=production
      - JWT_SECRET=supersecretkey
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

  # --- MONGODB ---
  mongo:
    image: mongo:6.0
    container_name: master-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    # volumes:
    #   - ./data/mongo:/data/db
    tmpfs:
      - /data/db
    ports:
      - "27017:27017"
    networks:
      - master-network

  # --- CRUD BACKENDS ---
  backend-1:
    build: ./simple-crud-backend
    container_name: master-backend-1
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

  backend-2:
    build: ./simple-crud-backend
    container_name: master-backend-2
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

  backend-3:
    build: ./simple-crud-backend
    container_name: master-backend-3
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-3
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:example@mongo:27017/myapp?authSource=admin
    networks:
      - master-network

networks:
  master-network:
    driver: bridge
