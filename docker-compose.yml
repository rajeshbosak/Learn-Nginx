services:
  # --- API GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: standard-gateway
    ports:
      - "8085:80"
    volumes:
      - ./linux-nginx-configs/docker-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3
    networks:
      - app-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ./simple-crud-frontend
    container_name: simple-crud-frontend
    environment:
      - VITE_API_HOST=
      - APP_NAME=Nginx Demo (Decoupled)
    networks:
      - app-network

  # --- BACKENDS ---
  backend-1:
    build: ./simple-crud-backend
    container_name: simple-crud-backend-1
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - NODE_ENV=production
    networks:
      - app-network

  backend-2:
    build: ./simple-crud-backend
    container_name: simple-crud-backend-2
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - NODE_ENV=production
    networks:
      - app-network

  backend-3:
    build: ./simple-crud-backend
    container_name: simple-crud-backend-3
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-3
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
