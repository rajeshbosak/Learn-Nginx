# =========================================================
# DECOUPLED STANDARD DOCKER API GATEWAY CONFIG
# =========================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream simple_crud_backend {
    least_conn;
    server backend-1:5000;
    server backend-2:5000;
    server backend-3:5000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API routes
    location ~ ^/(health|ready|metrics|items|api|debug|slow|unstable|status|payload|cpu|admin|cache|stream) {
        limit_req zone=api_limit burst=20 nodelay;
        
        # Specific for streaming
        if ($uri ~ /stream/) {
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        proxy_pass http://simple_crud_backend;
    }

    # Frontend (Proxy to dedicated frontend container)
    location / {
        proxy_pass http://frontend_app;
    }
}
