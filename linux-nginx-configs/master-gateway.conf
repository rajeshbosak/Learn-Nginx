# =========================================================
# DECOUPLED MASTER DOCKER API GATEWAY CONFIG
# =========================================================

# -----------------------------
# Rate Limiting
# -----------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# -----------------------------
# WebSocket Support
# -----------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================================================
# UPSTREAMS
# =========================================================

upstream auth_service {
    least_conn;
    server auth-service:4001;
}

upstream user_service {
    least_conn;
    server user-service:4002;
}

upstream product_service {
    least_conn;
    server product-service:4003;
}

upstream simple_crud_backend_app {
    least_conn;

    server backend-1:5000;
    server backend-2:5000;
    server backend-3:5000;
}

upstream frontend_app {
    server frontend:80;
}

# =========================================================
# MAIN SERVER
# =========================================================

server {
    listen 80;
    server_name localhost;

    # -----------------------------
    # Common Proxy Settings
    # -----------------------------
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # WebSocket Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # =====================================================
    # GATEWAY HEALTH
    # =====================================================

    location = /gateway/health {
        default_type application/json;

        return 200 '{"service":"nginx-master-gateway","status":"ok"}';
    }

    # =====================================================
    # AUTH SERVICE
    # Public Routes
    # =====================================================

    location /api/auth/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://auth_service/auth/;
    }

    # =====================================================
    # USER SERVICE
    # Protected Routes
    # =====================================================

    location /api/users/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://user_service/users/;
    }

    # =====================================================
    # PRODUCT SERVICE
    # Protected Routes
    # =====================================================

    location /api/products/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://product_service/products/;
    }

    # Redirect /api/products -> /api/products/
    location = /api/products {
        return 301 /api/products/;
    }

    # =====================================================
    # CRUD BACKEND ROUTES
    # Load Balanced Across 3 Backends
    # =====================================================

    location ~ ^/(health|ready|metrics|items|api/v1|debug|admin|slow|unstable|status|payload|cpu|cache) {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://simple_crud_backend_app;
    }

    # =====================================================
    # STREAMING ROUTES
    # =====================================================

    location /stream/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_buffering off;
        proxy_cache off;

        proxy_pass http://simple_crud_backend_app;
    }

    # =====================================================
    # FRONTEND
    # =====================================================

    location / {
        proxy_pass http://frontend_app;
    }
}


# =========================================================
# SSL SERVER (HTTPS)
# Expects certificates mounted at /etc/nginx/ssl/myapp.crt and /etc/nginx/ssl/myapp.key
# =========================================================

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/myapp.crt;
    ssl_certificate_key /etc/nginx/ssl/myapp.key;

    # -----------------------------
    # Common Proxy Settings
    # -----------------------------
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # WebSocket Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Health endpoint
    location = /gateway/health {
        default_type application/json;

        return 200 '{"service":"nginx-master-gateway","status":"ok","proto":"https"}';
    }

    location /api/auth/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://auth_service/auth/;
    }

    location /api/users/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://user_service/users/;
    }

    location /api/products/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://product_service/products/;
    }

    location = /api/products {
        return 301 /api/products/;
    }

    location ~ ^/(health|ready|metrics|items|api/v1|debug|admin|slow|unstable|status|payload|cpu|cache) {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://simple_crud_backend_app;
    }

    location /stream/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_buffering off;
        proxy_cache off;

        proxy_pass http://simple_crud_backend_app;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}